[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlspp-dmx"
version = "0.1.0"
description = "Protocole DMX des boîtiers Bluetooth « USB-RDM-DMX » (Jieli JL_SPP, appli RY-AI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

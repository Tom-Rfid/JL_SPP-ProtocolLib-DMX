[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlspp-dmx"
version = "0.2.0"
description = "DMX protocol of the 'USB-RDM-DMX' Bluetooth interfaces (Jieli JL_SPP, RY-AI app), with fixture helpers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
